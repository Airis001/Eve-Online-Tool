# Fly.io の設定。手順は DEPLOY.md
# アプリ名を変えるときは app と EVE_PUBLIC_URL の両方を変える
app = "eve-tool-aigis"
primary_region = "nrt"  # 東京

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  EVE_DATA_DIR = "/data"
  EVE_PUBLIC_URL = "https://eve-tool-aigis.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # 使っていない間は止めて料金を抑える（開くと数秒で起動する）
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# キャラクターのログイン情報・保存したフィットなどを置くディスク（作り直しても消えない）
[[mounts]]
  source = "eve_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
